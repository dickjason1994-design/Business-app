mode: paper              # paper only; live trading is deliberately not implemented
broker: sim              # sim (built-in fake money) | ibkr (IBKR paper account, port 7497)
watchlist: [AAPL, MSFT, NVDA, TSLA, AMD, SPY, SHOP.TO, RY.TO]
starting_cash: 100000

risk:
  risk_per_trade_pct: 1.0     # % of equity risked per trade (entry -> stop)
  stop_loss_atr_mult: 2.0     # stop = entry - ATR * mult
  max_position_pct: 10.0      # max % of equity in one ticker
  max_daily_loss_pct: 3.0     # stop trading for the day past this loss
  max_open_positions: 5

signals:
  buy_score: 0.6              # composite score needed to buy
  sell_score: -0.3            # composite score that triggers a sell
  weights: {news: 0.3, whales: 0.3, volatility: 0.4}

news_feeds:
  - https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US

ibkr: {host: 127.0.0.1, port: 7497, client_id: 7}
