<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beer Predictor</title>
<style>
  :root { --bg:#1a1208; --card:#2a1d0c; --text:#fbe9c6; --muted:#c9ae7c; --accent:#f2a91d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:420px; }
  h1 { text-align:center; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; margin:12px 0 4px; color:var(--muted); font-size:14px; }
  select, input[type=range] { width:100%; }
  select { padding:8px; border-radius:8px; border:0; font-size:16px; }
  button { width:100%; padding:12px; margin-top:16px; border:0; border-radius:10px; background:var(--accent); color:#1a1208; font-size:18px; font-weight:700; cursor:pointer; }
  .big { font-size:64px; text-align:center; font-weight:800; color:var(--accent); }
  .center { text-align:center; }
  .row { display:flex; gap:8px; }
  .row button { margin-top:8px; }
  .glasses { font-size:28px; text-align:center; word-wrap:break-word; min-height:34px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🍺 Beer Predictor</h1>

  <div class="card">
    <label>What's the occasion?</label>
    <select id="occasion">
      <option value="1">Quiet night in</option>
      <option value="3" selected>Drinks with friends</option>
      <option value="5">Watching the game</option>
      <option value="6">Birthday / party</option>
      <option value="8">Bachelor party / festival</option>
    </select>

    <label>Friends coming: <b id="friendsV">2</b></label>
    <input type="range" id="friends" min="0" max="10" value="2">

    <label>Hours out: <b id="hoursV">3</b></label>
    <input type="range" id="hours" min="1" max="10" value="3">

    <label>Work tomorrow?</label>
    <select id="work">
      <option value="0.6">Yes, early</option>
      <option value="0.85">Yes, late start</option>
      <option value="1" selected>Nope</option>
    </select>

    <label>Mood</label>
    <select id="mood">
      <option value="0.7">Tired</option>
      <option value="1" selected>Chill</option>
      <option value="1.3">Celebrating</option>
      <option value="1.2">Rough week</option>
    </select>

    <button id="predict">Predict my night</button>
  </div>

  <div class="card center" id="result" hidden>
    <div>You're gonna drink about</div>
    <div class="big" id="num">0</div>
    <div id="verdict"></div>
  </div>

  <div class="card center">
    <div>Actual count tonight</div>
    <div class="big" id="count">0</div>
    <div class="glasses" id="glasses"></div>
    <div class="row">
      <button id="minus">−</button>
      <button id="plus">+ 🍺</button>
    </div>
    <div id="vsPred"></div>
  </div>

  <p class="center"><small>Just for fun. Drink responsibly, drink water, and never drink and drive.</small></p>
</main>
<script>
  const $ = id => document.getElementById(id);
  let predicted = null, count = 0;
  const today = new Date().toDateString();
  try {
    const s = JSON.parse(localStorage.getItem('beer') || '{}');
    if (s.date === today) { count = s.count || 0; predicted = s.predicted ?? null; }
  } catch {}

  function save() {
    try { localStorage.setItem('beer', JSON.stringify({ date: today, count, predicted })); } catch {}
  }

  ['friends', 'hours'].forEach(id => $(id).oninput = () => $(id + 'V').textContent = $(id).value);

  $('predict').onclick = () => {
    const base = +$('occasion').value;
    const perHour = 0.8 + Math.min(+$('friends').value, 6) * 0.1;
    const raw = (base + +$('hours').value * perHour) / 2 * +$('work').value * +$('mood').value;
    predicted = Math.max(1, Math.round(raw));
    showPrediction(); render(); save();
  };

  function showPrediction() {
    if (predicted == null) return;
    $('result').hidden = false;
    $('num').textContent = predicted;
    $('verdict').textContent =
      predicted <= 2 ? 'A civilized evening. 🧐' :
      predicted <= 5 ? 'Solid night. Pace yourself. 👍' :
      predicted <= 8 ? 'Big night! Line up a ride home. 🚕' :
                       'Legendary. Hydrate. Seriously. 💧';
  }

  function render() {
    $('count').textContent = count;
    $('glasses').textContent = '🍺'.repeat(count);
    $('vsPred').textContent = predicted == null ? '' :
      count < predicted ? `${predicted - count} to go (per the prediction)` :
      count === predicted ? 'Right on target 🎯' : `${count - predicted} over the prediction 😅`;
  }

  $('plus').onclick = () => { count++; render(); save(); };
  $('minus').onclick = () => { count = Math.max(0, count - 1); render(); save(); };

  showPrediction(); render();
</script>
</body>
</html>
